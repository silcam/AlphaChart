name: CI

on:
  push:
    branches: [master]
  pull_request:

# Superseded runs on the same ref are pointless; cancel them. Runs on master
# are kept (github.run_id makes each one its own group) so the history of what
# passed on the default branch stays intact.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing here needs a browser, and these two postinstall steps pull
      # ~350MB between them. Types come from the npm packages, not the
      # binaries, so skipping the downloads is safe for this job.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # setup-node >=v5 auto-caches when package.json sets packageManager,
          # which would shadow the explicit yarn cache step below. One owner.
          package-manager-cache: false

      # After setup-node, so the shims land in the Node version we just
      # installed. Corepack reads packageManager from package.json (yarn 4).
      - name: Enable Corepack
        run: corepack enable

      # Yarn 4 uses a global cache; `yarn config get cacheFolder` reports this
      # path. Cached deliberately instead of node_modules, and a miss only
      # costs time, never correctness.
      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # --immutable fails on a manifest/lockfile mismatch, which is what we
      # want: Dependabot updates the lockfile, so a mismatch is a real problem.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck server (including tests)
        run: yarn typecheck:server

      # Runs even when the server check fails, so one run reports all type
      # breakage rather than only the first project to go red.
      - name: Typecheck client (including tests)
        if: ${{ !cancelled() }}
        run: yarn typecheck:client

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same reasoning as the typecheck job: neither binary is used here. The
      # unit project never starts a browser, and the Cypress suite is separate.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # setup-node >=v5 auto-caches when package.json sets packageManager,
          # which would shadow the explicit yarn cache step below. One owner.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      # `yarn test` is the `unit` vitest project only: no Mongo, no network.
      # The *.int.test.ts suites need a live mongod and are not run here.
      # `vitest run` (not `vitest`) so it exits instead of entering watch mode.
      - name: Run unit tests
        run: yarn test --run

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Deliberately NOT skipping the puppeteer download: this job exists to
      # run the export path against a real Chrome. Cypress is still skipped —
      # the e2e suite is separate and its binary is not used here.
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # setup-node >=v5 auto-caches when package.json sets packageManager,
          # which would shadow the explicit yarn cache step below. One owner.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # Chrome for Testing is ~400MB. Keyed on the lockfile because that is
      # what pins the puppeteer version, and the version is what decides which
      # Chrome build the postinstall fetches. A miss just re-downloads.
      - name: Cache Chrome for Testing
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      # ubuntu-latest is >=24.04, which defaults
      # kernel.apparmor_restrict_unprivileged_userns=1. Chrome's sandbox needs
      # unprivileged user namespaces, and unlike the production host there is
      # no AppArmor profile here granting them, so `puppeteer.launch()` fails.
      # Lifted rather than launching with --no-sandbox: that would have CI
      # exercising a different launch path than production uses.
      - name: Allow unprivileged user namespaces (Chrome sandbox)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The `browser` vitest project: needs the Chrome above, but no Mongo.
      # Renders a chart through the real export endpoints and checks the bytes
      # coming back are a usable PNG/PDF, which is what catches a Chrome roll
      # that breaks rendering.
      - name: Run browser tests
        run: yarn test:browser --run
